name: Update Stock Data

on:
  schedule:
    # Run at 8:10 PM IST (2:40 PM UTC) Monday-Friday
    - cron: '40 14 * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check if market holiday
        id: holiday
        run: |
          result=$(python check_holiday.py)
          echo "result=$result" >> $GITHUB_OUTPUT
          echo "Holiday check result: $result"

      - name: Run apinse.py
        if: steps.holiday.outputs.result == 'WORKING'
        run: python apinse.py

      - name: Run web.py to update index.html
        if: steps.holiday.outputs.result == 'WORKING'
        run: python web.py

      - name: Commit and push changes
        if: steps.holiday.outputs.result == 'WORKING'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-update stock data: $(date '+%Y-%m-%d %H:%M')"
          git push
